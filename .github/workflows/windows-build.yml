name: Windows build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile Python source
        run: python -m py_compile main.py
      - name: Run controller tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Kontra AutoJump" --collect-all pynput main.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Kontra AutoJump.exe")) { throw "EXE was not created" }
